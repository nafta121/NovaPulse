name: Build and Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'NowBrief-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass novapulse123 \
            -keypass novapulse123 \
            -dname "CN=NovaPulse, OU=Mobile, O=NovaPulse, L=City, S=State, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests and Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: novapulse123
          KEY_PASSWORD: novapulse123
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NowBrief-v1.5.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowBrief-v1.5.0-release
          path: NowBrief-v1.5.0-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NowBrief-v1.5.0-release
          name: NowBrief v1.5.0 (ML Kit GenAI & Samsung PDE Audit Release)
          body: |
            ## 🌟 NowBrief (NovaPulse) v1.5.0 - ML Kit GenAI & Samsung PDE Audit Release
            
            - Bumped application version to `v1.5.0` (`versionCode = 4`).
            - **ML Kit GenAI Prompt API (Gemini Nano / AICore)**: Integrated `com.google.mlkit:genai-prompt:1.0.0-beta2` (`Generation.getClient()`) with `PromptPrefix` prefix caching, background engine `warmup()`, `close()` lifecycle cleanup, and XML-delimited `<personal_data_signals>` / `<notification>` inputs (`LocalLlmManager`, `BriefingAiGenerator`, `OnDeviceModelRunner`).
            - **Samsung Personal Data Engine (PDE) Cross-Signal Correlation**: Added pre-LLM cross-signal correlation combining Weather + Calendar + Routine + Sleep + Steps + Screen Time + Tasks + Expenses into structured insights before Gemini Nano / Gemini Cloud summarization (`BriefingAiGenerator`, `GeminiAiRepository`).
            - **ANR & Main-Thread I/O Fixes**: Moved `CalendarRepository`, `ScreenTimeRepository`, and `WeatherCacheManager` I/O off the main thread to `Dispatchers.IO`, debounced duplicate startup refreshes (`MainViewModel`, `DashboardScreen`, `MainActivity`, `DynamicIslandAccessibilityService`).
            - **Android 14+ Security & Play Policy Hardening**: Added `ContextCompat.RECEIVER_NOT_EXPORTED` on runtime broadcast receivers, narrowed `accessibility_service_config.xml` event types, and removed unused high-risk manifest permissions (`SYSTEM_ALERT_WINDOW`, `FOREGROUND_SERVICE_SPECIAL_USE`, static `TIME_TICK`).
            - **R8 & Compose Performance Optimization**: Enabled R8 minification & resource shrinking (`isMinifyEnabled = true`, `isShrinkResources = true`), wired `GlanceContextWidget().updateAll(context)` & `WidgetConfigActivity` `RESULT_OK`, fixed double status bar insets, and deleted 840+ lines of dead code.
          files: NowBrief-v1.5.0-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
