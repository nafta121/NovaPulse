name: Build and Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'NowBrief-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass novapulse123 \
            -keypass novapulse123 \
            -dname "CN=NovaPulse, OU=Mobile, O=NovaPulse, L=City, S=State, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests and Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: novapulse123
          KEY_PASSWORD: novapulse123
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NowBrief-v1.7.1-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowBrief-v1.7.1-release
          path: NowBrief-v1.7.1-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NowBrief-v1.7.1-release
          name: NowBrief v1.7.1 (Real Device Location, Weather, Localized News & YouTube Music Release)
          body: |
            ## 🌟 NowBrief (NovaPulse) v1.7.1 - Real Device Location, Weather, Localized News & YouTube Music Release
            
            - Bumped application version to `v1.7.1` (`versionCode = 7`).
            - **Real Device Location & Weather (`LocationHelper`, `WeatherRepository`, `WeatherCacheManager`)**:
              - Replaced hardcoded Ho Chi Minh City fallback with multi-stage real device location detection: fast cached `FusedLocationProviderClient.lastLocation` (<30 min), Android `LocationManager` (`GPS_PROVIDER` / `NETWORK_PROVIDER` / `PASSIVE_PROVIDER`), active balanced GPS fix, IP geolocation fallback (`ipwho.is` / `geojs.io`), and device timezone/country detection.
              - Added automatic purge of legacy `"Ho Chi Minh City"` cached weather entries outside Vietnam and HTTP reverse-geocoding fallback (`BigDataCloud`) when Android `Geocoder` is unavailable.
            - **Localized Live News & Market Tickers (`NewsMarketRepository`, `NewsMarketBriefCard`)**:
              - Fetches live regional news via Google News RSS localized to the device's detected country (`hl=id&gl=ID&ceid=ID:id` for Indonesia, plus CNBC Indonesia & ANTARA News) with real publisher `<source>` attribution.
              - Concurrently fetches live `USD/IDR` exchange rates (`open.er-api.com`) and live `BTC/USD`, `EMAS/USD (PAXG)`, and `ETH/USD` prices & 24h changes via CoinGecko API.
            - **Real-Time YouTube Music & Device Media Sessions (`RecentMediaTracker`, `SmartNotificationListenerService`, `MusicRecommendationHelper`, `YouTubeRecommendationHelper`, `SmartMusicCard`)**:
              - Reads active `MediaSessionManager` controllers and `PlaybackState` in real time for **YouTube Music** (`com.google.android.apps.youtube.music`), **YouTube**, **Spotify**, and **Samsung Music**, persisting deduplicated listening history on-device.
              - Added Android 11+ `<queries>` package visibility for YouTube Music, YouTube, Spotify, and Samsung Music, and personalized quick-search chips + YouTube recommendations based on real device listening history.
          files: NowBrief-v1.7.1-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
