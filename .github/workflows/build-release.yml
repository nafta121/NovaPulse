name: Build and Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'NowBrief-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass novapulse123 \
            -keypass novapulse123 \
            -dname "CN=NovaPulse, OU=Mobile, O=NovaPulse, L=City, S=State, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests and Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: novapulse123
          KEY_PASSWORD: novapulse123
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NowBrief-v1.7.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowBrief-v1.7.0-release
          path: NowBrief-v1.7.0-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NowBrief-v1.7.0-release
          name: NowBrief v1.7.0 (Full One UI 7/8 Live Notification & Now Bar Spec Release)
          body: |
            ## 🌟 NowBrief (NovaPulse) v1.7.0 - Full One UI 7/8 Live Notification & Now Bar Spec Release
            
            - Bumped application version to `v1.7.0` (`versionCode = 6`).
            - **Full Akexorcist Samsung One UI 7/8 `ongoingActivityNoti` Specification (`NowBarLiveService`)**:
              - **Gradient Live Notification Drawer + Status Bar Chip + Lock Screen Now Bar**: Upgraded channel to `nowbrief_samsung_nowbar_v2` (`IMPORTANCE_LOW`, `VISIBILITY_PUBLIC`) so One UI renders the prominent gradient Live Notification card in the drawer alongside the Status Bar Chip and Lock Screen Now Bar.
              - **Dynamic Icons & Colors per Card Category**: Added `chipIcon`, `secondaryInfoIcon` (`Icon.createWithResource`), `chipBgColor`, and `chipExpandedText` tailored to each real-device card (Weather, AI Brief, Steps/Calories, Calendar, Tasks, Screen Time).
              - **Multi-Segment Progress Bar Style**: Added `progress`, `progressMax = 100`, `progressSegments.icon`, `progressSegments.progressColor`, and `progressSegments` (`segmentStart` + `segmentColor`) reflecting real-time Energy Score, Step Goal %, and Screen Time %.
              - **Interactive Action Buttons (`actionType = 1`, `actionPrimarySet = 0`)**: Added **"Berikutnya"** (`ACTION_NEXT_CARD`) to cycle live cards directly from the Lock Screen / Notification Drawer and **"Buka Brief"** to launch into the full AI summary.
              - **Hybrid One UI 7 + One UI 8 (Android 16)**: Combines `android.ongoingActivityNoti.*` + `semFlags |= 32768` with Android 16 `setRequestPromotedOngoing(true)` + `setShortCriticalText()`.
          files: NowBrief-v1.7.0-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
