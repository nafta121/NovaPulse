name: Build and Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'NowBrief-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass novapulse123 \
            -keypass novapulse123 \
            -dname "CN=NovaPulse, OU=Mobile, O=NovaPulse, L=City, S=State, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: novapulse123
          KEY_PASSWORD: novapulse123
        run: gradle assembleRelease --stacktrace

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NowBrief-v1.3.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowBrief-v1.3.0-release
          path: NowBrief-v1.3.0-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NowBrief-v1.3.0-release
          name: NowBrief v1.3.0 (English Release)
          body: |
            ## 🌟 NowBrief (NovaPulse) v1.3.0 - Full English Release
            
            - Bumped application version to `v1.3.0` (`versionCode = 2`).
            - Complete English translation across UI, AI prompts, 7-session briefings, widgets, Dynamic Island (NowPill), notifications, on-device ML/engine modules, and documentation.
            - Built and signed automatically via GitHub Actions.
          files: NowBrief-v1.3.0-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
