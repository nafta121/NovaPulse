name: Build and Release APK

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
      - 'NowBrief-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore "${{ github.workspace }}/my-upload-key.jks" \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass novapulse123 \
            -keypass novapulse123 \
            -dname "CN=NovaPulse, OU=Mobile, O=NovaPulse, L=City, S=State, C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit Tests and Build Release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: novapulse123
          KEY_PASSWORD: novapulse123
        run: gradle testDebugUnitTest assembleRelease --stacktrace

      - name: Prepare Release APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk NowBrief-v1.6.0-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NowBrief-v1.6.0-release
          path: NowBrief-v1.6.0-release.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: NowBrief-v1.6.0-release
          name: NowBrief v1.6.0 (Samsung One UI Native Now Bar & Live Notification Release)
          body: |
            ## 🌟 NowBrief (NovaPulse) v1.6.0 - Samsung One UI Native Now Bar & Live Notification Release
            
            - Bumped application version to `v1.6.0` (`versionCode = 5`).
            - **Native Samsung One UI 7+ Now Bar & Android 16 Promoted Live Notification (`NowBarLiveService`)**: Injects NowBrief directly into Samsung's status bar pill and Lock Screen Now Bar using `android.ongoingActivityNoti.*` Bundle extras, `Notification.semFlags` bit `32768`, `com.samsung.android.support.ongoing_activity` metadata, and `com.kakao.taxi` package whitelist bypass, with Android 16 `setRequestPromotedOngoing(true)` + `setShortCriticalText()` fallback.
            - **100% Real Device Data in Lock Screen Dynamic Island & Now Bar**: Connected Lock Screen Dynamic Island (`DynamicIslandAccessibilityService`, `DynamicIslandUi`) and `NowBarLiveService` to real device weather + location (`WeatherRepository`), steps + calories (`StepCounterManager`, `HealthConnectRepository`), calendar events (`CalendarRepository`), tasks (`TaskDao`), expenses (`ExpenseDao`), screen time (`ScreenTimeRepository`), and sleep routine (`RoutineRepository`).
            - **Lock Screen Dynamic Island Gesture & Recomposition Fixes**: Fixed `Lifecycle.State.RESUMED` on Lock Screen, replaced `FLAG_LAYOUT_NO_LIMITS` with `FLAG_LAYOUT_IN_SCREEN` for accurate touch hit-testing, and added swipe-up to collapse, swipe-left/right to switch tabs, and lock screen keyguard dismiss on tap (`MainActivity`).
          files: NowBrief-v1.6.0-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
